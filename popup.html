<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1e;
            color: #ffffff;
        } h2 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            opacity: 0.8;
        } button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        } button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        } button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h2>Extensão Foco</h2>
    <button id="btnAtualizar">Atualizar Bloqueios</button>
    <script src="popup.js"></script>
    <h2 id="statusTexto">Bloqueios: Ativos</h2>
    <button id="btnToggle">Desativar Bloqueios</button>
    <script src="popup.js" defer></script>
</body>
</html>
